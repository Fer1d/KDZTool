name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ zlib1g-dev libzstd-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Strip
        run: strip build/kdz-tool

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kdz-tool-linux-x86_64
          path: build/kdz-tool
          if-no-files-found: error

  windows:
    name: Windows x86_64 (MSYS2 UCRT64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-zstd

      - name: Configure
        run: >-
          cmake -S . -B build-win -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DZLIB_USE_STATIC_LIBS=ON -DCMAKE_EXE_LINKER_FLAGS=-static

      - name: Build
        run: cmake --build build-win --parallel

      - name: Show runtime dependencies
        run: ldd build-win/kdz-tool.exe

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kdz-tool-windows-x86_64
          path: build-win/kdz-tool.exe
          if-no-files-found: error

  android:
    name: Android ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [ arm64-v8a, armeabi-v7a ]
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config curl

      - name: Locate the Android NDK
        id: ndk
        run: |
          set -e
          NDK="${ANDROID_NDK_LATEST_HOME:-}"
          if [ -z "$NDK" ]; then NDK=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1); fi
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then echo "no Android NDK found"; exit 1; fi
          echo "ndk=$NDK" >> "$GITHUB_OUTPUT"
          echo "using NDK: $NDK"

      - name: Cross-build zstd
        env:
          NDK: ${{ steps.ndk.outputs.ndk }}
          ABI: ${{ matrix.abi }}
        run: |
          set -eux
          TC="$NDK/build/cmake/android.toolchain.cmake"
          PREFIX="$PWD/android-prefix/$ABI"
          mkdir -p "$PREFIX"

          # zlib comes from the NDK sysroot; only zstd has to be built for the target.
          curl -fsSL -o zstd.tar.gz https://github.com/facebook/zstd/releases/download/v1.5.6/zstd-1.5.6.tar.gz
          tar xf zstd.tar.gz
          cmake -S zstd-1.5.6/build/cmake -B zstd-build -G Ninja \
                -DCMAKE_TOOLCHAIN_FILE="$TC" -DANDROID_ABI="$ABI" -DANDROID_PLATFORM=android-24 \
                -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_BUILD_TYPE=Release \
                -DZSTD_BUILD_PROGRAMS=OFF -DZSTD_BUILD_TESTS=OFF -DZSTD_BUILD_SHARED=OFF \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build zstd-build --parallel
          cmake --install zstd-build

      - name: Configure kdz-tool
        env:
          NDK: ${{ steps.ndk.outputs.ndk }}
          ABI: ${{ matrix.abi }}
        run: |
          set -eux
          PREFIX="$PWD/android-prefix/$ABI"
          export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig"
          export PKG_CONFIG_SYSROOT_DIR=/
          cmake -S . -B build-android -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
                -DANDROID_ABI="$ABI" -DANDROID_PLATFORM=android-24 \
                -DZLIB_USE_STATIC_LIBS=ON

      - name: Build
        run: cmake --build build-android --parallel

      - name: Inspect
        run: file build-android/kdz-tool && ls -l build-android/kdz-tool

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kdz-tool-android-${{ matrix.abi }}
          path: build-android/kdz-tool
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [ linux, windows, android ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download the artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect and checksum the binaries
        run: |
          set -eux
          mkdir -p dist
          for dir in artifacts/*/; do
            artifact=$(basename "$dir")
            file=$(find "$dir" -type f -name 'kdz-tool*' | head -n 1)
            [ -n "$file" ] || { echo "no binary in $artifact"; exit 1; }
            case "$artifact" in
              *windows*) cp "$file" dist/kdz-tool-windows-x86_64.exe ;;
              *)         cp "$file" "dist/$artifact" ;;
            esac
          done

          # every platform must be present, a partial release is worse than none
          test -f dist/kdz-tool-linux-x86_64
          test -f dist/kdz-tool-windows-x86_64.exe
          test -f dist/kdz-tool-android-arm64-v8a
          test -f dist/kdz-tool-android-armeabi-v7a
          chmod +x dist/kdz-tool-linux-x86_64 dist/kdz-tool-android-*

          cd dist
          sha256sum kdz-tool-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eux
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          elif ! gh release create "$TAG" dist/* --title "KDZTool $TAG" --notes-from-tag; then
            # fall back to the commit log when the tag carries no annotation
            gh release create "$TAG" dist/* --title "KDZTool $TAG" --generate-notes
          fi
